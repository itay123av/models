<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f9fafb">
<title>מודלים חישוביים — סדנה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff;
  --bg:#f9fafb;
  --panel:#ffffff;
  --ink:#1f2937;
  --ink-strong:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --indigo:#4f46e5;
  --indigo-2:#818cf8;
  --indigo-soft:#eef2ff;
  --green:#16a34a;
  --green-soft:#dcfce7;
  --red:#ef4444;
  --red-soft:#fee2e2;
  --amber:#d97706;
  --amber-soft:#fef3c7;
  /* טקסט על רקע לבן/בהיר — עומד בניגודיות AA (4.5:1); --green/--red/--amber נשארים לקווים ולמילוי */
  --green-ink:#166534;
  --red-ink:#b91c1c;
  --amber-ink:#92400e;
  --dot:#e5e7eb;
  --shadow:0 10px 30px rgba(17,24,39,.08);
  --shadow-sm:0 2px 8px rgba(17,24,39,.05);
  --r:16px; --r-sm:11px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Heebo',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
.ic{width:1.1em;height:1.1em;flex-shrink:0;vertical-align:-2px}
.app{position:fixed; inset:0}

/* ─── FLOATING CARDS ─── */
.float{position:fixed; z-index:20; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 16px 46px rgba(17,24,39,.10)}
.float-head{display:flex; align-items:center; gap:9px; padding:11px 15px; border-bottom:1px solid var(--line); cursor:grab; user-select:none; touch-action:none; font-weight:800; color:var(--ink-strong); font-size:15px}
.float-head:active{cursor:grabbing}
.grip{width:13px; height:13px; flex-shrink:0; background-image:radial-gradient(var(--muted) 1.3px, transparent 1.5px); background-size:5px 5px; opacity:.6}
.float-body{padding:14px 15px}
.brand-icon{width:34px;height:34px; background:var(--indigo); border-radius:10px;
  display:grid; place-items:center; color:#fff; font-size:18px; font-weight:800; box-shadow:0 6px 18px rgba(79,70,229,.28); flex-shrink:0}
.brand-float{top:16px; left:16px; display:flex; align-items:center; gap:11px; padding:9px 16px 9px 13px}
.bf-title{font-weight:800; color:var(--ink-strong); font-size:16px}
.panel-float{top:58px; right:14px; width:238px; max-height:calc(100dvh - 74px); display:flex; flex-direction:column}
.panel-float .float-head{padding:9px 14px; font-size:14px}
.float-toggle{margin-inline-start:auto; border:none; background:transparent; color:var(--muted); font-size:15px; line-height:1; width:30px; height:28px; border-radius:8px; cursor:pointer}
.float-toggle:hover{background:#f3f4f6; color:var(--ink-strong)}
.float.collapsed .float-body{display:none}
.float.collapsed .float-head{border-bottom:none}
.panel-float .float-body{overflow-y:auto; padding:10px 12px}
.cp-model{display:flex; align-items:center; gap:8px}
.cp-model .mtype{font-size:10px; font-weight:800; color:#fff; background:var(--indigo); padding:3px 8px; border-radius:999px; letter-spacing:.5px}
.cp-model .mname{font-weight:800; color:var(--ink-strong); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.cp-iconbtn{width:28px;height:28px;border:none;background:transparent;color:var(--muted);cursor:pointer;border-radius:7px;display:grid;place-items:center}
.cp-iconbtn:hover{background:var(--indigo-soft); color:var(--indigo)}
.cp-sel:not(:empty){margin-top:13px; padding-top:13px; border-top:1px solid var(--line)}
.cp-sec{margin-top:9px}
.cp-h{font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); font-weight:800; margin-bottom:7px; display:flex; align-items:center; gap:6px}
.cp-row{display:flex; gap:8px; flex-wrap:wrap}
.cp-row .btn{flex:1; min-width:0; padding-left:10px; padding-right:10px}
.btn-step{background:var(--indigo); color:#fff; border-color:transparent}
.btn-step:hover{background:#4338ca; color:#fff}
.tape-float{bottom:18px; left:50%; transform:translateX(-50%); max-width:min(72vw,720px)}
.tape-float .float-body{padding:12px 14px}
.stack-float{top:74px; left:16px; max-width:min(42vw,380px)}
.stack-float .float-body{padding:11px 13px; max-height:calc(100vh - 210px); overflow:auto}
.stk-hint{margin-top:8px; font-size:10.5px; color:var(--muted); text-align:center; line-height:1.4}
.cfg-card.idle{opacity:.9}
.pda-sub{font-size:12.5px;color:var(--muted);text-align:center;margin:2px 0 16px}
.pda-box{width:80px;height:54px;text-align:center;font-size:18px;font-weight:700;color:var(--ink-strong);border:1.5px solid var(--line);border-radius:13px;background:#fff;font-family:'Courier New',monospace}
.pda-box::placeholder{color:var(--muted);font-weight:500;font-size:14px;font-family:'Heebo',sans-serif}
.pda-box:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgba(79,70,229,.16)}
.pda-quick{display:flex;justify-content:center;gap:11px}
.pda-chip{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border:1.5px solid var(--line);border-radius:12px;background:#f3f4f6;font-size:16px;font-weight:700;color:var(--ink-strong);cursor:pointer;font-family:'Courier New',monospace}
.pda-chip span{font-size:12px;font-weight:500;color:var(--muted);font-family:'Heebo',sans-serif}
.pda-chip:hover{border-color:var(--indigo);background:var(--indigo-soft)}
.pda-chip.sm{padding:0 14px;height:48px;font-size:15px}
.pda-lbl{font-size:12.5px;font-weight:700;color:var(--ink-strong);margin-bottom:7px;text-align:right}
.pda-row{display:flex;align-items:center;gap:9px}
/* שדה סימנים + כפתור סימן (ε) לידו */
.sym-row{display:flex;align-items:stretch;gap:8px}
.sym-row input{flex:1;min-width:0}
.sym-row .pda-chip.sm{height:auto;min-height:44px;flex-shrink:0;padding:0 16px;font-size:18px}
.pda-box.wide{width:auto;flex:1;height:48px;font-size:17px}
.pda-modes{display:flex;gap:8px}
.pda-mode{flex:1;padding:11px 6px;border:1.5px solid var(--line);border-radius:12px;background:#f3f4f6;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;font-family:'Heebo',sans-serif}
.pda-mode:hover{border-color:var(--indigo)}
.pda-mode.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
.pda-oplbl{font-size:12px;color:var(--muted);white-space:nowrap;min-width:96px;text-align:right}
.pda-hint{margin-top:11px;font-size:11.5px;color:#4b5563;text-align:center;line-height:1.5;background:#f3f4f6;border-radius:9px;padding:8px 10px}
/* ── פענוח AI: הדגשת ביטחון נמוך + תצוגת חיתוך ── */
.pda-box.lowconf{border-color:var(--amber);background:var(--amber-soft);box-shadow:0 0 0 3px rgba(217,119,6,.18)}
.pda-modes.lowconf{outline:2px solid var(--amber);outline-offset:3px;border-radius:13px}
.conf-badge{display:inline-flex;align-items:center;align-self:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber);border-radius:8px;padding:3px 7px;white-space:nowrap}
.ai-crop{margin-bottom:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.ai-crop-lbl{font-size:11px;font-weight:700;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line);background:#f3f4f6}
.ai-crop img{display:block;max-width:100%;max-height:130px;margin:6px auto}
.ai-crop-fallback{display:none;padding:16px;text-align:center;color:var(--muted);font-size:12px}
.ai-crop.noimg img{display:none}
.ai-crop.noimg .ai-crop-fallback{display:block}
.ai-conf-note{font-size:11px;font-weight:600;color:var(--amber);margin-bottom:11px;text-align:center;background:var(--amber-soft);border:1px solid var(--amber);border-radius:9px;padding:7px 9px}
.ai-imp-help{font-size:12px;color:var(--muted);margin-bottom:9px;line-height:1.5}

.guide-float{position:fixed; bottom:18px; left:16px; z-index:21; display:flex; flex-direction:column; gap:9px; align-items:flex-start}
.guide-btn{display:inline-flex; align-items:center; gap:9px; background:var(--ink-strong); color:#fff; border:none; border-radius:999px; padding:11px 18px; font-family:inherit; font-weight:800; font-size:14px; cursor:pointer; box-shadow:0 10px 30px rgba(17,24,39,.22)}
.guide-body{background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 16px 46px rgba(17,24,39,.10); padding:14px 16px; max-width:320px; max-height:54vh; overflow-y:auto; font-size:13.5px; color:var(--muted); line-height:1.75}
.guide-body ul{padding-inline-start:18px; display:flex; flex-direction:column; gap:6px}
.guide-body b{color:var(--ink-strong)}
/* tabs bar (top) */
.tabbar{position:fixed; top:0; left:0; right:0; z-index:30; display:flex; align-items:center; gap:9px; background:#fff; border-bottom:1px solid var(--line); box-shadow:0 4px 16px rgba(17,24,39,.04); padding:7px 12px}
.tab-add{flex-shrink:0; width:34px; height:34px; border:none; border-radius:9px; background:var(--indigo); color:#fff; font-size:23px; font-weight:700; cursor:pointer; display:grid; place-items:center; line-height:0}
.tab-add:hover{background:#4338ca}
.tabs{flex:1; display:flex; gap:6px; overflow-x:auto; overflow-y:hidden; align-items:center; min-width:0; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex; align-items:center; gap:7px; padding:7px 9px; border-radius:9px; background:var(--paper); border:1px solid var(--line); cursor:pointer; white-space:nowrap; flex-shrink:0}
.tab:hover{border-color:var(--indigo-2)}
.tab.active{background:var(--indigo-soft); border-color:var(--indigo)}
.tab-type{font-size:9px; font-weight:800; color:#fff; background:var(--muted); padding:2px 6px; border-radius:999px; letter-spacing:.4px}
.tab.active .tab-type{background:var(--indigo)}
.tab-name{font-weight:700; color:var(--ink-strong); overflow:hidden; text-overflow:ellipsis; max-width:120px; font-size:13.5px}
.tab-x{border:none; background:transparent; color:var(--muted); cursor:pointer; font-size:13px; line-height:1; padding:1px 4px; border-radius:5px}
/* פוקוס מקלדת על מצב או מעבר בקנבס */
.node:focus,.edge:focus{outline:none}
.node:focus-visible .ncirc{stroke:var(--indigo); stroke-width:5; stroke-dasharray:6 4}
.edge:focus-visible .eline{stroke:var(--indigo); stroke-width:4}
.edge:focus-visible .elabel{fill:var(--indigo)}
/* שם הלשונית הוא כפתור — כדי שאפשר יהיה להגיע אליו ב-Tab */
.tab-open{display:flex; align-items:center; gap:7px; background:none; border:0; padding:0; margin:0; font:inherit; color:inherit; cursor:pointer; min-width:0; border-radius:6px}
.tab-x:hover{background:var(--red-soft); color:var(--red)}
.tabbar-brand{flex-shrink:0; display:flex; align-items:center; gap:9px; font-weight:800; color:var(--ink-strong); font-size:15px; white-space:nowrap; padding-inline-start:6px}
.tabbar-brand .brand-icon{width:30px; height:30px; font-size:16px; border-radius:9px}

/* ─── BUTTONS ─── */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; background:var(--panel); color:var(--ink);
  border:1px solid var(--line); border-radius:999px; padding:7px 16px; font-family:inherit; font-size:14px; font-weight:700;
  cursor:pointer; transition:border-color .18s,color .18s,background .18s,box-shadow .18s; box-shadow:var(--shadow-sm); min-height:34px}
.btn:hover{border-color:var(--indigo-2); color:var(--indigo)}
.btn:disabled{opacity:.45; cursor:default; box-shadow:none}
.btn-primary{background:var(--indigo); color:#fff; border-color:transparent}
.btn-primary:hover{background:#4338ca; color:#fff; box-shadow:0 8px 22px rgba(79,70,229,.35)}
.btn-run{background:#15803d; color:#fff; border-color:transparent}
.btn-run:hover{background:var(--green-ink); color:#fff}
.btn-delete{background:var(--red); color:#fff; border-color:transparent}
.btn-delete:hover{background:#dc2626; color:#fff}
.btn-icon{padding:0; width:42px; height:42px; border-radius:11px}
.btn-lg{padding:10px 20px; font-size:15px; min-height:40px}
.btn-sm{padding:5px 12px; font-size:13px; min-height:29px}

/* ─── CANVAS (full screen) ─── */
.canvas-area{position:absolute; inset:0; overflow:hidden; background:var(--paper);
  background-image:radial-gradient(var(--dot) 1.4px, transparent 1.4px); background-size:24px 24px}
.canvas-area[data-arming="1"]{cursor:crosshair}
#canvas{width:100%; height:100%; display:block; touch-action:none; user-select:none; -webkit-user-select:none}
.arm-banner{position:absolute; top:62px; left:50%; transform:translateX(-50%); z-index:6;
  background:var(--ink-strong); color:#fff; padding:9px 18px; border-radius:999px; font-weight:600; font-size:13.5px;
  box-shadow:var(--shadow); display:none; align-items:center; gap:8px}
.arm-banner.show{display:flex}
.arm-banner b{color:#c7d2fe}
.stage-empty{position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; padding:24px; text-align:center}
.stage-empty .se{max-width:340px; color:var(--muted)}
.stage-empty .se .se-ic{width:64px;height:64px;margin:0 auto 14px; color:var(--indigo-2)}
.stage-empty .se b{color:var(--ink-strong)}

/* SVG graph */
.node{cursor:grab}
.node:active{cursor:grabbing}
.node .ncirc{fill:#fff; stroke:var(--ink); stroke-width:3; transition:stroke .15s,fill .15s,filter .15s}
.node:hover .ncirc{filter:drop-shadow(0 4px 10px rgba(17,24,39,.18))}
.node .nacc{fill:none; stroke:var(--ink); stroke-width:2.5}
.node .nlabel{fill:var(--ink); font-weight:800; font-size:19px; pointer-events:none; font-family:'Heebo',sans-serif}
.node.sel .ncirc{stroke:var(--indigo); stroke-width:4.5}
.node.armed .ncirc{stroke:var(--indigo); stroke-width:4.5; stroke-dasharray:8 5}
.node.active .ncirc{fill:var(--indigo); stroke:#4338ca}
.node.active .nlabel{fill:#fff}
.node.active .nacc{stroke:#fff}
.node.active.ok .ncirc{fill:var(--green)}
.node.active.bad .ncirc{fill:var(--red)}
.sarrow{stroke:#475569; stroke-width:3; fill:none}
.edge .eline{stroke:#475569; stroke-width:2.6; fill:none}
.edge .ehit{stroke:transparent; stroke-width:22; fill:none; pointer-events:stroke; cursor:pointer}
.edge .elabel{fill:var(--ink-strong); font-weight:800; font-size:17px; pointer-events:none; paint-order:stroke; stroke:#fff; stroke-width:5px; font-family:'Heebo',sans-serif; direction:ltr; unicode-bidi:bidi-override}
.edge.sel .eline{stroke:var(--indigo); stroke-width:3.6}
.edge.active .eline{stroke:var(--green); stroke-width:3.6}
#arrow path{fill:#475569}
#arrowG path{fill:var(--green)}
#arrowA path{fill:var(--amber)}
.node.ai-low .ncirc{stroke:var(--amber); stroke-width:4.5; fill:var(--amber-soft); filter:drop-shadow(0 0 10px rgba(217,119,6,.32))}
.node.ai-low .nacc{stroke:var(--amber)}
.edge.ai-low .eline{stroke:var(--amber); stroke-width:4; stroke-dasharray:9 5; filter:drop-shadow(0 0 7px rgba(217,119,6,.34))}
.edge.ai-low .elabel{fill:var(--amber); stroke:#fff8e1; stroke-width:6px}
.edge.ai-low.sel .eline{stroke:#b45309}
.edge.cur .eline{stroke:var(--green); stroke-width:3.8; transition:stroke .15s}
.edge.cur .elabel{fill:var(--green)}
.pulse-dot{fill:var(--green); filter:drop-shadow(0 0 6px rgba(22,163,74,.8)); pointer-events:none}
.state-ripple{fill:none; stroke:var(--green); stroke-width:3.5; vector-effect:non-scaling-stroke; pointer-events:none; transform-box:fill-box; transform-origin:center; animation:ripple .55s ease-out forwards}
@keyframes ripple{from{transform:scale(1); opacity:.9} to{transform:scale(2.1); opacity:0}}
.ai-review-panel{position:fixed;top:64px;right:292px;z-index:18;width:min(340px,calc(100vw - 330px));max-height:42vh;overflow:auto;background:#fff;border:1px solid #f59e0b;border-radius:14px;box-shadow:0 16px 40px rgba(217,119,6,.18);padding:11px 12px;display:none}
.ai-review-panel.show{display:block}
.ai-review-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;color:#92400e;font-weight:900;font-size:13px}
.ai-review-close{border:none;background:transparent;color:#92400e;font-size:18px;line-height:1;cursor:pointer;border-radius:7px;width:28px;height:28px}
.ai-review-close:hover{background:var(--amber-soft)}
.ai-review-item{display:block;width:100%;text-align:right;border:1px solid #fbbf24;background:var(--amber-soft);color:#78350f;border-radius:10px;padding:8px 9px;margin-top:7px;cursor:pointer;font-family:'Heebo',sans-serif}
.ai-review-item:hover{background:#fde68a}
.ai-review-main{font-weight:800;font-size:12.5px;direction:ltr;text-align:left}
.ai-review-sub{font-size:11px;color:#92400e;margin-top:3px;line-height:1.35}
.ai-review-note{font-size:11.5px;color:#78350f;line-height:1.4;margin:-2px 0 4px}
.ai-review-section{font-size:11px;font-weight:900;color:#92400e;letter-spacing:.02em;margin:12px 2px 0}
.ai-review-card{cursor:default}
.ai-review-card:hover{background:var(--amber-soft)}
.ai-review-card.doubt{border-color:#ea580c;border-width:2px;background:#fff7ed}
.ai-review-title{font-weight:800;font-size:12.5px;color:#7c2d12}
.ai-review-link{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;width:100%;border:none;background:none;padding:0;cursor:pointer;font-family:inherit;text-align:right;color:inherit}
.ai-review-link .ai-review-main{text-align:right}
.ai-review-concern{font-size:12px;font-weight:800;color:#c2410c}
.ai-review-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.ai-review-chips .chip{padding:4px 10px;font-size:12px;min-height:0}
.ai-review-chips .chip.hint{border-color:#ea580c;color:#c2410c}
.ai-review-chips .ai-review-ok{margin-inline-start:auto;border-color:var(--green);color:#15803d}
.ai-review-diag{margin-top:12px;font-size:11px;color:#78350f}
.ai-review-diag summary{cursor:pointer;font-weight:800;color:#92400e}
.ai-review-diag div{border-top:1px dashed #fcd34d;padding:5px 2px;line-height:1.35;overflow-wrap:anywhere}
.ai-review-panel.collapsed{width:auto;padding:0;border:none;background:transparent;box-shadow:none;overflow:visible}
.ai-review-pill{border:1.5px solid #f59e0b;background:#fffbeb;color:#92400e;font-family:'Heebo',sans-serif;font-weight:800;font-size:12.5px;border-radius:999px;padding:7px 14px;cursor:pointer;box-shadow:0 8px 22px rgba(217,119,6,.18)}
.ai-review-pill:hover{background:#fde68a}
.node.ai-doubt .ncirc{stroke:#ea580c;stroke-dasharray:8 5}
.ndoubt circle{fill:#ea580c;stroke:#fff;stroke-width:2.5}
.ndoubt text{fill:#fff;font-size:15px;font-weight:900;pointer-events:none}
.rule-edit{display:block;width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 8px;margin:5px 0;text-align:right;cursor:pointer;color:var(--ink);font-family:'Heebo',sans-serif}
.rule-edit:hover{border-color:var(--indigo);background:var(--indigo-soft)}
.rule-edit.ai-low{border-color:#f59e0b;background:var(--amber-soft);color:#78350f}
/* בעיה סמנטית — כלל שנקרא כפי שהוא, אך אינו חוקי ולכן אינו מבוצע.
   נבדל בכוונה מסימון ביטחון-חזותי-נמוך (ai-low). */
.rule-edit.rule-bad{border-color:#dc2626;background:#fef2f2;color:#7f1d1d}
.rule-sem{font-size:10.5px;font-weight:700;margin-top:4px;line-height:1.4;color:#b91c1c}
.pda-sem{margin-top:9px;font-size:11.5px;font-weight:700;color:#b91c1c;background:#fef2f2;border:1px solid #fca5a5;border-radius:9px;padding:8px 10px;text-align:center;line-height:1.5}
/* בין 561 ל-760: לוח הבקרה (238px) נשאר מימין — רשימת הבדיקה לידו ולא מאחוריו */
@media (max-width:760px){.ai-review-panel{left:12px;right:262px;top:56px;width:auto;max-height:34vh}.ai-review-panel.collapsed{left:auto}}
/* tape / film strip */
.tape{position:relative; display:inline-block; background:var(--bg); border:1.5px solid var(--line); border-radius:14px; padding:16px 14px 12px}
.tape::before,.tape::after{content:''; position:absolute; left:10px; right:10px; height:6px; background-image:radial-gradient(circle, var(--line) 2px, transparent 2.3px); background-size:15px 6px}
.tape::before{top:5px} .tape::after{bottom:5px}
.tape-label{font-size:11px; font-weight:800; color:var(--muted); letter-spacing:.6px; margin-bottom:8px; text-transform:uppercase}
.tape-cells{display:flex; gap:8px; flex-wrap:nowrap; padding:2px 0}
.cell{position:relative; display:grid; place-items:center; min-width:42px; height:48px; padding:0 11px; border-radius:9px; background:#fff; border:2px solid var(--line); font-family:'Courier New',monospace; font-weight:800; font-size:21px; color:var(--ink); transition:all .18s}
.cell.read{background:var(--green-soft); border-color:var(--green); color:var(--green-ink)}
.cell.head{background:var(--indigo); color:#fff; border-color:transparent; transform:translateY(-3px); box-shadow:0 9px 18px rgba(79,70,229,.32)}
.cell.stuck{background:var(--red-soft); border-color:var(--red); color:var(--red-ink)}
.cell.blank{color:var(--muted)}
.cell.marker{background:#475569; color:#fff; border-color:#475569; font-weight:900}
.cell .hmark{position:absolute; top:-13px; left:50%; transform:translateX(-50%); width:0; height:0; border-left:7px solid transparent; border-right:7px solid transparent; border-top:9px solid var(--indigo)}
.cell.empty{font-family:'Heebo',sans-serif; font-weight:600; font-size:14px; color:var(--muted); font-style:italic; border-style:dashed; min-width:150px}

/* ─── INSPECTOR ─── */
.inspector{background:var(--panel); border-inline-start:1px solid var(--line); overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:16px}
.sec-title{font-size:12px; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); font-weight:800; margin-bottom:9px; display:flex; align-items:center; gap:6px}
.fld{width:100%; background:var(--paper); border:1.5px solid var(--line); border-radius:var(--r-sm); padding:11px 12px; color:var(--ink); font-family:inherit; font-size:15px}
.fld:focus{outline:none; border-color:var(--indigo)}
.lbl{display:block; font-size:13px; color:var(--muted); font-weight:700; margin:2px 0 6px}
.help-box{font-size:14px; color:var(--muted); line-height:1.7}
.help-box ol{padding-inline-start:20px; display:flex; flex-direction:column; gap:9px; margin-top:6px}
.help-box b{color:var(--ink-strong)}
.insp-title{font-size:17px; font-weight:800; color:var(--ink-strong); margin-bottom:4px}
.toggles{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0}
.chip{display:flex; align-items:center; justify-content:center; gap:6px; padding:11px 8px; border-radius:var(--r-sm);
  border:1.5px solid var(--line); background:var(--paper); color:var(--muted); font-weight:700; font-size:13.5px; cursor:pointer; transition:all .15s}
.chip:hover{border-color:var(--indigo-2)}
.chip.on{background:var(--indigo); color:#fff; border-color:transparent}
.insp-actions{display:flex; flex-direction:column; gap:9px; margin-top:4px}
.divider{height:1px; background:var(--line); margin:2px 0}

/* validator */
.vbadge{display:inline-flex; align-items:center; gap:7px; padding:7px 13px; border-radius:999px; font-size:13.5px; font-weight:800; margin:0 0 8px}
.vbadge.ok{background:var(--green-soft); color:var(--green)}
.vbadge.amber{background:var(--amber-soft); color:var(--amber)}
.vbadge.danger{background:var(--red-soft); color:var(--red)}
.vrow{font-size:13.5px; color:var(--muted); padding:2px 0; line-height:1.55}
.vrow.warn{color:var(--amber)}
.vstat{margin-top:11px; padding-top:11px; border-top:1px solid var(--line); font-size:13px; color:var(--muted)}
.legend-body{font-size:13.5px; color:var(--muted); line-height:1.75}
.legend-body ul{padding-inline-start:18px; display:flex; flex-direction:column; gap:5px}
.legend-body b{color:var(--ink-strong)}
details.legend>summary{cursor:pointer; font-size:12px; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); font-weight:800; list-style:none}
details.legend>summary::-webkit-details-marker{display:none}
details.legend[open]>summary{margin-bottom:10px}

/* ─── RUN BAR ─── */
.run-card{background:var(--bg); border:1.5px solid var(--line); border-radius:14px; padding:14px}
.run-btns{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.run-btns .btn{flex:1; min-width:84px}
.insp-sel:not(:empty){margin-top:16px; padding-top:16px; border-top:1px solid var(--line)}
.simstat{display:flex; flex-direction:column; gap:3px; font-size:13.5px; color:var(--muted)}
.simstat b{color:var(--ink-strong)}
.cfg-list{margin-top:6px; display:flex; flex-direction:column; gap:4px; max-height:200px; overflow-y:auto}
.cfg{font-size:12px; color:var(--muted); background:var(--paper); border:1px solid var(--line); border-radius:7px; padding:5px 8px; line-height:1.45; font-family:'Courier New',monospace}
.cfg b{color:var(--ink-strong)}
.cfg.acc{background:var(--green-soft); border-color:var(--green); color:var(--green)}
.cfg.acc b{color:var(--green)}
.cfg-label{margin-top:11px; font-size:11.5px; font-weight:700; color:var(--ink-strong)}
.cfg-label span{font-weight:500; color:var(--muted)}
.cfg-cards{margin-top:7px; display:flex; flex-wrap:wrap; gap:9px; max-height:300px; overflow-y:auto; padding-bottom:2px; align-items:flex-start}
.cfg-card{flex:0 0 auto; min-width:72px; background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:7px 9px 9px; display:flex; flex-direction:column; align-items:center; gap:7px}
.cfg-card.acc{background:var(--green-soft); border-color:var(--green)}
.cfg-card.more-card{justify-content:center; text-align:center; font-size:11px; color:var(--muted); min-width:52px}
.cfg-top{font-size:11.5px; color:var(--muted); text-align:center; line-height:1.45}
.cfg-top b{color:var(--ink-strong)}
.cfg-card.acc .cfg-top, .cfg-card.acc .cfg-top b{color:var(--green)}
.cfg-rem{display:block; font-size:10.5px; margin-top:1px}
.stk-wrap{display:flex; flex-direction:column; align-items:center; gap:2px}
.stk-cap{font-size:9px; font-weight:700; color:var(--green); letter-spacing:.4px}
.stk{display:flex; flex-direction:column}
.stk-cell{position:relative; min-width:30px; height:23px; display:flex; align-items:center; justify-content:center; font-family:'Courier New',monospace; font-weight:700; font-size:13px; color:var(--ink-strong); background:#fff; border:1.5px solid var(--ink); border-bottom:0}
.stk-cell:last-child{border-bottom:1.5px solid var(--ink)}
.stk-cell:first-child{border-radius:5px 5px 0 0}
.stk-cell.top{color:var(--green); box-shadow:inset 0 0 0 1.5px var(--green); z-index:1}
.stk-cell.empty{min-width:46px; color:var(--muted); font-weight:600; font-size:10.5px; border:1.5px dashed var(--line); border-radius:5px; font-family:'Heebo',sans-serif}
.stk-cell.more{color:var(--muted); font-size:10.5px; border-style:dashed; font-family:'Heebo',sans-serif}
.stk-floor{width:42px; height:5px; background:var(--ink); border-radius:0 0 4px 4px}
.cfg-card.acc .stk-cell{border-color:var(--green)}
.cfg-card.acc .stk-cell.empty{border-color:var(--green); color:var(--green)}
.cfg-card.acc .stk-floor{background:var(--green)}
.word-label{display:inline-flex; align-items:center; gap:7px; font-weight:800; color:var(--indigo); font-size:16px}
.word-label .ic{width:1.3em; height:1.3em}
.tapebar{flex:0 0 auto; min-width:0; background:transparent; padding:8px 12px}
#tapeBar{min-width:0; max-width:100%; overflow-x:auto; direction:ltr}
.tape-empty{color:var(--muted); font-size:14px; padding:8px 2px; direction:rtl}
.word{width:100%; margin-top:7px; font-family:'Courier New',monospace; font-size:17px; letter-spacing:2px; padding:10px 12px; border:2px solid var(--line); border-radius:10px; background:#fff; color:var(--ink)}
.word:focus{outline:none; border-color:var(--indigo); box-shadow:0 0 0 4px rgba(79,70,229,.18)}
.word::placeholder{color:var(--muted); letter-spacing:0; font-family:'Heebo',sans-serif; font-size:14px}
.run-extra{display:flex; gap:11px; align-items:center; flex-wrap:wrap}
.ivis{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.ichar{display:grid; place-items:center; min-width:38px; height:42px; padding:0 8px; border-radius:10px; background:var(--paper);
  border:2px solid var(--line); font-family:'Courier New',monospace; font-weight:700; font-size:19px; color:var(--ink); transition:all .12s}
.ichar.done{opacity:.4}
.ichar.cur{background:var(--indigo); color:#fff; border-color:transparent; transform:translateY(-4px); box-shadow:0 8px 16px rgba(79,70,229,.3)}
.ichar.empty{font-style:italic; color:var(--muted); font-family:inherit; letter-spacing:0}
.simctrls{display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.spd{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); font-weight:700}
.simline{font-size:14px; color:var(--muted)}
.simline b{color:var(--ink-strong)}
.simpath{font-size:14px; color:var(--muted); font-family:'Courier New',monospace; word-break:break-word}
.verdict{padding:11px 20px; border-radius:13px; font-weight:800; font-size:18px; display:inline-flex; align-items:center; gap:9px}
.verdict.ok{background:var(--green-soft); color:var(--green-ink)}
.verdict.bad{background:var(--red-soft); color:#991b1b}

/* batch */
.bhead{display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap}
.bsum{font-size:14px; font-weight:800; color:var(--ink-strong)}
.brow{display:flex; gap:8px; align-items:center; margin-bottom:8px}
.brow .bword{flex:1; font-family:'Courier New',monospace; letter-spacing:2px}
.brow .bexp{width:120px}
.bres{min-width:130px; font-size:13.5px; font-weight:800}
.bres.ok{color:var(--green-ink)} .bres.bad{color:var(--red-ink)}

/* ─── MODAL ─── */
.modal-bg{position:fixed; inset:0; background:rgba(17,24,39,.45); backdrop-filter:blur(6px); display:none; place-items:center; z-index:100}
.modal-bg.show{display:grid}
.modal{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:26px; width:min(560px,93vw); max-height:88vh; overflow-y:auto; box-shadow:var(--shadow); animation:pop .2s}
@keyframes pop{from{transform:scale(.94); opacity:0}}
.modal h2{margin-bottom:18px; font-size:21px; color:var(--ink-strong)}
.modal input,.modal select,.modal textarea{width:100%; background:var(--paper); border:1.5px solid var(--line); border-radius:var(--r-sm); padding:11px; color:var(--ink); font-family:inherit; font-size:15px}
.modal input:focus,.modal textarea:focus,.modal select:focus{outline:none; border-color:var(--indigo)}
.modal-actions{display:flex; gap:11px; justify-content:flex-end; margin-top:22px; align-items:center; flex-wrap:wrap}
.lib-item{display:flex; align-items:center; gap:10px; padding:13px; border:1.5px solid var(--line); border-radius:var(--r-sm); background:var(--paper); margin-bottom:9px}
.lib-item.cur{border-color:var(--indigo); box-shadow:0 0 0 3px var(--indigo-soft)}
.lib-item .li-main{flex:1; min-width:0; cursor:pointer; background:none; border:0; padding:0; font:inherit; color:inherit; text-align:start; border-radius:8px}
.lib-item .li-name{font-weight:800; color:var(--ink-strong); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lib-item .li-meta{font-size:13px; color:var(--muted)}
.lib-item .li-act{width:34px;height:34px;border:1px solid var(--line);background:var(--panel);border-radius:9px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.lib-item .li-act:hover{border-color:var(--indigo-2); color:var(--indigo)}

/* ─── TOAST ─── */
.toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(140px); background:var(--ink-strong); color:#fff; padding:13px 22px; border-radius:13px; box-shadow:var(--shadow); font-weight:700; z-index:200; transition:transform .3s; max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.danger{background:#dc2626}
.toast.success{background:#15803d}
.toast-action{margin-inline-start:14px; background:transparent; color:#fff; border:1.5px solid rgba(255,255,255,.65); border-radius:8px; padding:3px 12px; font:inherit; font-weight:800; cursor:pointer}
.toast-action:hover{background:rgba(255,255,255,.15)}

@media(max-width:560px){
  .tabbar-brand{display:none}
  .panel-float{left:8px; right:8px; width:auto; top:54px; max-height:58dvh}
  .tape-float{max-width:94vw; bottom:64px; max-height:max(72px, calc(42dvh - 126px)); overflow:auto}   /* מעל כפתור המדריך, ולא עולה על לוח הבקרה */
  .guide-float{bottom:12px}
  /* אוטומט מחסנית: כרטיס המחסנית והסרט חולקים את הרצועה התחתונה. הגובה
     המרבי נגזר מגובה לוח הבקרה (58dvh+54px) כדי שאף כרטיס לא יעלה עליו. */
  body.has-stack .stack-float{top:auto; left:auto; right:8px; bottom:64px; max-width:calc(50vw - 12px); max-height:max(72px, calc(42dvh - 126px)); overflow:auto}
  body.has-stack .tape-float{left:8px; transform:none; max-width:calc(50vw - 12px)}
  /* רשימת הבדיקה כגיליון תחתון מעל הכרטיסים; לוח הבקרה נשאר גלוי למעלה */
  .ai-review-panel{top:auto; bottom:12px; left:8px; right:8px; max-height:44dvh; z-index:25}
  .ai-review-panel.collapsed{left:auto; right:8px}
}
/* ── סריקת שרטוט (מצלמה) ── */
.scan-modal{width:min(480px,92vw)}
.scan-state{display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 2px;text-align:center}
.scan-state[hidden]{display:none}
.scan-modal [hidden]{display:none}
.scan-msg{font-size:13px;color:var(--muted);line-height:1.6}
.scan-msg b{color:var(--ink-strong)}
.scan-ic{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:25px;background:linear-gradient(135deg,#f3f4f6,#e5e7eb)}
.scan-ic.warn{background:linear-gradient(135deg,var(--amber-soft),#fde68a);color:var(--amber)}
.scan-ic.bad{background:linear-gradient(135deg,#fee2e2,#fecaca);color:#dc2626}
.scan-spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--indigo);animation:scanspin .8s linear infinite}
@keyframes scanspin{to{transform:rotate(360deg)}}
.scan-drop{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;padding:26px 14px;border:2px dashed var(--indigo);border-radius:16px;cursor:pointer;background:linear-gradient(180deg,#ffffff,#f9fafb);transition:background .25s,border-color .25s,transform .15s,box-shadow .25s}
.scan-drop:hover,.scan-drop.over{background:linear-gradient(180deg,#f9fafb,#eef2ff);transform:translateY(-1px);box-shadow:0 8px 20px rgba(79,70,229,.14)}
.scan-drop-t{font-size:14px;color:var(--ink)}
.scan-drop-sub{font-size:11.5px;color:var(--muted)}
.scan-foot{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:10px}
.scan-tag{font-size:10.5px;color:var(--muted);background:#f3f4f6;border-radius:7px;padding:3px 8px}
.scan-actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.scan-img{max-width:100%;max-height:240px;border-radius:12px;border:1px solid var(--line);box-shadow:0 8px 22px rgba(17,24,39,.10);transition:opacity .3s}
.scan-img.dim{opacity:.45}
.scan-bar{width:100%;height:8px;border-radius:6px;background:#f3f4f6;overflow:hidden}
.scan-bar-fill{height:100%;width:38%;border-radius:6px;background:linear-gradient(90deg,var(--indigo-2),var(--indigo),var(--indigo-2));animation:scanflow 1.4s linear infinite}
@keyframes scanflow{0%{transform:translateX(-120%)}100%{transform:translateX(330%)}}
/* ── מעברי צבע חלקים והדרגתיות (גרדיאנטים) ── */
.btn{transition:background .2s,box-shadow .2s,transform .12s,border-color .2s,color .2s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--indigo);border-color:transparent}
.btn-primary:hover{background:#4338ca;box-shadow:0 8px 20px rgba(79,70,229,.30)}
.btn-run{background:#15803d;border-color:transparent;color:#fff}
.btn-run:hover{background:var(--green-ink);box-shadow:0 8px 20px rgba(22,163,74,.25)}
.float{transition:box-shadow .25s}
.float:hover{box-shadow:0 20px 50px rgba(17,24,39,.14)}
.verdict.ok{background:linear-gradient(135deg,#dcfce7,#bbf7d0)}
.verdict.bad{background:linear-gradient(135deg,#fee2e2,#fecaca)}
.tab.active{background:var(--indigo-soft)}
.modal{animation:modalin .18s ease}
@keyframes modalin{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.node .ncirc,.node .nacc{transition:fill .25s,stroke .25s}
.edge .eline{transition:stroke .22s}
.edge .elabel{transition:fill .22s}
.stk-cell{transition:border-color .25s,color .25s,background .25s}
.stk-cell.top{animation:stkin .22s ease}
@keyframes stkin{from{transform:translateY(-9px);opacity:0}to{transform:none;opacity:1}}
.stk-floor{background:var(--ink)}
.cfg-card.acc .stk-floor{background:var(--green)}
</style>
</head>
<body>
<div class="app">
  <!-- FULL-SCREEN CANVAS -->
  <div class="canvas-area" id="canvasArea">
    <div class="arm-banner" id="armBanner" role="status" aria-live="polite"></div>
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="לוח השרטוט — מצבים ומעברים">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0,0 L10,5 L0,10 z"></path>
        </marker>
        <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0,0 L10,5 L0,10 z"></path>
        </marker>
        <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0,0 L10,5 L0,10 z"></path>
        </marker>
      </defs>
      <g id="edges"></g>
      <g id="nodes"></g>
    </svg>
    <div class="ai-review-panel" id="aiReviewPanel"></div>
    <div class="stage-empty" id="stageEmpty">
      <div class="se"><div class="se-ic" style="font-size:44px">◯→◎</div><div>לחץ <b>«+ מצב חדש»</b> בלוח הבקרה כדי להתחיל לבנות אוטומט.</div></div>
    </div>
  </div>

  <!-- BRAND (top-left) -->
  <!-- TABS BAR (full-width, top) -->
  <div class="tabbar" id="tabBar">
    <button class="tab-add" onclick="newModel()" title="מודל חדש (אוטומט סופי / אוטומט מחסנית / מכונת טיורינג)" aria-label="מודל חדש">+</button>
    <div class="tabs" id="tabs" role="group" aria-label="המודלים הפתוחים"></div>
    <div class="tabbar-brand"><div class="brand-icon">Σ</div><span>מודלים חישוביים</span></div>
  </div>

  <!-- CONTROL PANEL (top-right, draggable) -->
  <div class="float panel-float" id="controlPanel">
    <div class="float-head"><span class="grip"></span><span>לוח בקרה</span><button class="float-toggle" id="cpToggle" onclick="toggleControlPanel()" title="מזער את לוח הבקרה" aria-expanded="true">▴</button></div>
    <div class="float-body">
      <div class="cp-model">
        <span class="mtype" id="modelType">DFA</span>
        <span class="mname" id="modelName">—</span>
        <button class="cp-iconbtn" id="renameBtn" title="שנה שם" aria-label="שנה את שם המודל" onclick="renameModel()"></button>
      </div>
      <div class="cp-sec">
        <div class="cp-h">קובץ</div>
        <div class="cp-row">
          <button class="btn btn-sm" id="resetBtn" onclick="resetBoard()"></button>
          <button class="btn btn-sm" id="libBtn" onclick="openLibrary()"></button>
          <button class="btn btn-sm" id="saveBtn" onclick="exportCurrent()"></button>
        </div>
        <button class="btn btn-sm" id="aiBtn" onclick="openAiScan()" style="width:100%;margin-top:8px;display:none">סרוק שרטוט מצולם (AI)</button>
      </div>
      <div class="cp-sec">
        <div class="cp-h">מצבים</div>
        <button class="btn btn-primary" id="addStateBtn" onclick="addStateCentered()" style="width:100%"></button>

/* ההודעה היא אזור חי (role=status) — קורא מסך מקריא אותה. אחרי שהיא גולשת

function hideToast(t){ t.className='toast'; toastTimer=null; t.onmouseenter=t.onmouseleave=t.onfocusin=t.onfocusout=null;

function toast(msg, type='',duration){ const t=$('toast');

  const visibleFor=Number.isFinite(Number(duration))?Number(duration):(type==='danger'?10000:3200);

/* ── ביטול מחיקה ─────────────────────────────────────────────────────────
   מחיקות שמתבצעות מיד (בלי חלון אישור) מציעות "בטל" בהודעה לכמה שניות.
   נשמר צילום לפני המחיקה. אם מאז נשמר שינוי נוסף, הביטול נחסם — כדי

/* הודעה עם כפתור פעולה. הספירה נעצרת כל עוד העכבר מעליה, ו-onExpire נקרא

function toastAction(msg,actionText,onAction,duration=10000,onExpire){ const t=$('toast'); if(!t)return;
  if(toastTimer){clearTimeout(toastTimer);toastTimer=null;}
  const hide=()=>{ hideToast(t); if(onExpire)onExpire(); };
  t.textContent=''; const text=document.createElement('span'); text.textContent=msg;
  const b=document.createElement('button'); b.type='button'; b.className='toast-action'; b.textContent=actionText;
  if(actionText==='בטל'){ b.title='בטל (Ctrl+Z)'; b.setAttribute('aria-keyshortcuts','Control+Z'); }
  b.onclick=()=>{ if(toastTimer){clearTimeout(toastTimer);toastTimer=null;} hideToast(t); onAction(); };
  t.append(text,b); t.className='toast show';
  /* העכבר או הפוקוס (Tab) על ההודעה עוצרים את הספירה */
  t.onmouseenter=t.onfocusin=()=>{ if(toastTimer){clearTimeout(toastTimer);toastTimer=null;} };
  t.onmouseleave=t.onfocusout=()=>{ if(!toastTimer)toastTimer=setTimeout(hide,4000); };
  toastTimer=setTimeout(hide,duration); }
function undoLast(){ const token=UNDO; if(!token)return false; UNDO=null;
  if(SAVE_SEQ!==token.seq){ toast('אי אפשר לבטל — בוצעו שינויים נוספים מאז','danger'); return false; }
  token.restore(); return true; }
function offerUndo(message,restore){ if(!restore){ toast(message); return; }
  const token={restore,seq:SAVE_SEQ}; UNDO=token;

/* Ctrl+Z (או Cmd+Z) = הכפתור «בטל» שבהודעה, באותו חלון זמן. לפי e.code,
   כדי שיעבוד גם בפריסת מקלדת עברית (שם e.key הוא «ז»). בשדה טקסט לא מגיעים
   לכאן — שם Ctrl+Z מבטל הקלדה כרגיל. */
function handleUndoShortcut(e){
  if(!(e.ctrlKey||e.metaKey)||e.shiftKey||e.altKey)return false;
  if(e.code!=='KeyZ'&&String(e.key).toLowerCase()!=='z')return false;
  e.preventDefault();
  if(!UNDO){ toast('אין מה לבטל — אפשר לבטל מחיקה רק כל עוד ההודעה עליה מוצגת'); return true; }
  const t=$('toast'); if(t&&t.querySelector&&t.querySelector('.toast-action'))hideToast(t);
  undoLast(); return true; }

function restoreModelPoint(point){ return point&&(()=>{ const m=DB.automata.find(a=>a.id===point.id); if(!m)return;
  const back=JSON.parse(point.json); Object.keys(m).forEach(k=>delete m[k]); Object.assign(m,back);
  current=m; DB.settings.lastId=m.id; sel={type:null,id:null}; armed=null; stopPlay(); SIM=null;
  save(); renderAll(); fitView(); toast('בוטל','success'); }); }
/* מכניס טקסט במקום הסמן בשדה (מחליף בחירה), או בסופו אם אין מידע על הסמן */
function insertAtCaret(input,text){ if(!input)return;
  const v=String(input.value||''), s=Number.isInteger(input.selectionStart)?input.selectionStart:v.length,
    e=Number.isInteger(input.selectionEnd)?input.selectionEnd:s;
  input.value=v.slice(0,s)+text+v.slice(e);
  const p=s+text.length; try{ if(input.setSelectionRange)input.setSelectionRange(p,p); }catch(_){}
  if(input.focus)input.focus(); }

/* ─── dialog system ─── */
function topModal(){ const all=qa('.modal-bg:not(.closing)'); return all[all.length-1]||null; }
function modalFocusables(root){ return [...root.querySelectorAll('button,input,select,textarea,a[href],[tabindex]:not([tabindex="-1"])')]
  .filter(el=>!el.disabled&&el.getClientRects().length); }
/* מקלדת בחלון: Escape = ביטול. Enter = הכפתור הראשי, אלא אם הפוקוס על כפתור —
   אז Enter מפעיל את הכפתור הזה (קודם Enter על «ביטול» הפעיל את «מחק»).
   בכפתור בחירה (סוג מודל, דחיפה/שליפה) Enter בוחר בו ומאשר. Tab נשאר בתוך
   החלון. רק החלון העליון מגיב — קודם Escape בחלון אישור סגר גם את הספרייה שמתחתיו. */
function dialogKey(e,bg,dismiss){
  if(e.key==='Escape'){ e.preventDefault(); dismiss(); return; }
  if(e.key==='Tab'){ const f=modalFocusables(bg.querySelector('.modal')||bg); if(!f.length)return;
    const a=document.activeElement, i=f.indexOf(a);
    if(i<0){ e.preventDefault(); (e.shiftKey?f[f.length-1]:f[0]).focus(); }
    else if(e.shiftKey&&i===0){ e.preventDefault(); f[f.length-1].focus(); }
    else if(!e.shiftKey&&i===f.length-1){ e.preventDefault(); f[0].focus(); }
    return; }
  if(e.key!=='Enter'||e.shiftKey||e.isComposing)return;
  const tg=e.target&&e.target.closest?e.target:null;
  if(tg&&tg.closest('textarea,a'))return;
  const b=tg&&tg.closest('button');
  if(b){ if(!b.matches('.chip,.pda-mode'))return;
    e.preventDefault(); if(!b.classList.contains('on'))b.click(); }
  const p=bg.querySelector('.btn-primary,.btn-delete'); if(p){ e.preventDefault(); p.click(); }
}
function _buildDialog({title, message, body, buttons, dismissValue=null}){
  return new Promise(resolve=>{
    const opener=document.activeElement, did='dlg'+uid();
    const bg=document.createElement('div'); bg.className='modal-bg show';
    bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true"${title?` aria-labelledby="${did}-t"`:''}${message?` aria-describedby="${did}-m"`:''}>
      ${title?`<h2 id="${did}-t">${esc(title)}</h2>`:''}
      ${message?`<p id="${did}-m" style="color:var(--muted);margin-bottom:16px;line-height:1.6;white-space:pre-wrap">${esc(message)}</p>`:''}
      <div class="dialog-body"></div><div class="modal-actions"></div></div>`;
    if(body) bg.querySelector('.dialog-body').appendChild(body);
    const actions=bg.querySelector('.modal-actions');
    /* הדיאלוג נעלם באנימציה של 150ms אך ה-Promise נפתר מיד; closing מסמן אותו
       כך ש-closeTopModal לא יסגור אותו שוב במקום את הדיאלוג שמתחתיו.
       הפוקוס חוזר למה שפתח את החלון (אם הוא עדיין על המסך). */
    const close=val=>{ document.removeEventListener('keydown',escH); bg.classList.add('closing'); bg.style.opacity='0'; setTimeout(()=>bg.remove(),150);
      if(opener&&opener!==document.body&&opener.isConnected&&opener.focus)opener.focus(); resolve(val); };
    (buttons||[]).forEach(btn=>{ const b=document.createElement('button');
      b.className='btn'+(btn.primary?' btn-primary':'')+(btn.danger?' btn-delete':''); b.textContent=btn.text;
      b.onclick=()=>close(btn.value); actions.appendChild(b); });
    bg.addEventListener('click',e=>{ if(e.target===bg) close(dismissValue); });
    /* חלון שהוסר מבחוץ (closeTopModal) מסיר כאן את המאזין שלו */
    function escH(e){ if(!bg.isConnected){ document.removeEventListener('keydown',escH); return; }
      if(topModal()!==bg||bg.classList.contains('closing'))return;
      dialogKey(e,bg,()=>close(dismissValue)); }
    document.addEventListener('keydown',escH); document.body.appendChild(bg);
    setTimeout(()=>{ const i=bg.querySelector('input,textarea'); if(i){i.focus(); i.select&&i.select();} else bg.querySelector('.btn-primary,.btn-delete,.btn')?.focus(); },50);
  });
}
function confirmDialog(title, message='', opts={}){
  return _buildDialog({title, message, buttons:[
    {text:opts.cancelText||'ביטול', value:false},
    {text:opts.confirmText||'אישור', value:true, primary:!opts.danger, danger:!!opts.danger}], dismissValue:false});
}
function promptDialog(title, opts={}){
  const wrap=document.createElement('div');
  if(opts.label){ const l=document.createElement('label'); l.textContent=opts.label;
    l.style.cssText='display:block;margin-bottom:7px;font-size:14px;color:var(--ink-strong);font-weight:700'; wrap.appendChild(l); }
  const input=document.createElement('input'); input.type='text';
  if(opts.placeholder)input.placeholder=opts.placeholder; if(opts.value)input.value=opts.value;
  if(opts.label)input.setAttribute('aria-label',opts.label);
  /* כפתורי סימן לתווים שאין במקלדת (למשל ε). הסימן נכנס במקום הסמן;
     mousedown לא מוציא את הפוקוס מהשדה, כדי שהסמן יישאר במקומו. */
  if(opts.symbolButtons&&opts.symbolButtons.length){
    const row=document.createElement('div'); row.className='sym-row'; row.appendChild(input);
    opts.symbolButtons.forEach(sb=>{ const b=document.createElement('button'); b.type='button'; b.className='pda-chip sm';
      b.textContent=sb.symbol; b.title=sb.label; b.setAttribute('aria-label',sb.label);
      b.addEventListener('mousedown',e=>e.preventDefault());
      b.addEventListener('click',()=>insertAtCaret(input,sb.symbol)); row.appendChild(b); });
    wrap.appendChild(row);
  } else wrap.appendChild(input);
  const SUBMIT=Symbol();
  return _buildDialog({title, message:opts.message, body:wrap, buttons:[
    {text:'ביטול', value:null}, {text:opts.confirmText||'שמור', value:SUBMIT, primary:true}], dismissValue:null})
    .then(v=> v===SUBMIT ? input.value.trim() : null);
}

function tmMoveText(value){ const m=tmMoveCode(value); return m==='R'?'ימינה':(m==='L'?'שמאלה':'ללא תנועה'); }
function transLabelLines(t){   /* שורה לכל חוק — נערמות אנכית על החץ */
  if(current && current.type==='tm') return (t.rules||[]).map(r=>String(r.raw_label_text||'').trim()||`${r.read}→${r.write},${tmMoveCode(r.move)}`);
  /* שורה לכל כלל, בסדר החזותי שבו הכללים נשמרו. הסדר הוא לתצוגה בלבד

     ראש המחסנית תהיה גלויה על הקנבס ולא מוסתרת. */
  if(current && current.type==='pda') return (t.rules||[]).map(r=>{ const P=pdaRuleParts(r);
    const act=P.invalidAction?'?':(P.removeTop?('−'+(P.popSym||'ε')):(P.op==='push'&&!P.push.length?'+?':(P.push.length?'+'+P.push.join(''):'·')));
    const bad=r.scanIncomplete||pdaRuleBlocked(r)?' ⚠':'';

function normalizeTransitionTopology(model){
  if(!model||!Array.isArray(model.transitions))return model;
  model.transitions.forEach(t=>{if(t&&typeof t==='object')t.selfLoop=Boolean(t.from!=null&&t.from===t.to);});
  return model;
}
/* מודל מקובץ מיובא או מאחסון ישן עלול להיות שבור. מעבר שמפנה למצב שלא
   קיים הפיל את הציור — ומכיוון שהמודל כבר נשמר, האפליקציה נשארה שבורה בכל
   טעינה. כאן משלימים מזהים, מיקומים ומערכים חסרים, ומשמיטים רק מעבר שאין
   לו מקור או יעד. מחזיר את מספר המעברים שהושמטו. */
function sanitizeModel(a){
  const tp=String(a.type||'dfa').toLowerCase();
  if(tp==='nfa'||tp==='npda'){ a.ndet=true; }
  a.type=(tp==='pda'||tp==='npda')?'pda':(tp==='tm'?'tm':'dfa');
  if(typeof a.name!=='string'||!a.name.trim())a.name='מודל מיובא';
  if(!Array.isArray(a.tests))a.tests=[];
  if(!Array.isArray(a.alphabet))a.alphabet=[];
  const seen=new Set();
  a.states=(Array.isArray(a.states)?a.states:[]).filter(s=>s&&typeof s==='object');
  a.states.forEach((s,i)=>{
    s.id=(s.id==null||s.id==='')?'':String(s.id); if(!s.id||seen.has(s.id))s.id=uid(); seen.add(s.id);
    if(s.label==null||String(s.label).trim()==='')s.label='q'+i; else s.label=String(s.label);
    if(!Number.isFinite(s.x))s.x=150+(i%5)*170; if(!Number.isFinite(s.y))s.y=150+Math.floor(i/5)*170;
    s.isStart=Boolean(s.isStart); s.isAccept=Boolean(s.isAccept); });
  const all=(Array.isArray(a.transitions)?a.transitions:[]).filter(t=>t&&typeof t==='object');
  a.transitions=all.filter(t=>{ t.from=t.from==null?'':String(t.from); t.to=t.to==null?'':String(t.to); return seen.has(t.from)&&seen.has(t.to); });
  a.transitions.forEach(t=>{ if(t.id==null||t.id==='')t.id=uid();
    if(a.type==='dfa')t.symbols=Array.isArray(t.symbols)?t.symbols.map(String):parseSyms(t.symbols);
    else if(!Array.isArray(t.rules))t.rules=[]; });
  normalizeTransitionTopology(a);
  return all.length-a.transitions.length;

  const lit=w=>{ for(let k=0;k<w.length;k++){ if(s[i]!==w[k])fail(); i++; } };
  const str=()=>{ i++;
    while(i<n){ const c=s[i];
      if(c==='"'){ i++; return; }
      if(c==='\\'){ i++; if(i>=n)fail();

  const val=()=>{ ws(); if(i>=n)fail(); const c=s[i];
    if(c==='{'){ i++; ws(); if(s[i]==='}'){ i++; return; }
      for(;;){ ws(); if(s[i]!=='"')fail(); str(); ws(); if(s[i]!==':')fail(); i++; val(); ws();
        if(s[i]===','){ i++; continue; } if(s[i]==='}'){ i++; return; } fail(); } }
    if(c==='['){ i++; ws(); if(s[i]===']'){ i++; return; }
      for(;;){ val(); ws(); if(s[i]===','){ i++; continue; } if(s[i]===']'){ i++; return; } fail(); } }

    if(c==='t')return lit('true'); if(c==='f')return lit('false'); if(c==='n')return lit('null');

/* ─── validation ─── */
function alphabet(){ const s=new Set(); if(current) current.transitions.forEach(t=>(t.symbols||[]).forEach(x=>{ if(x!=='ε') s.add(x); })); return [...s].sort(); }   /* ε אינו אות באלפבית */
function computeValidation(){
  const a=current, dupes=[], gaps=[], starts=a.states.filter(s=>s.isStart);
  if(a.type==='tm'){
    a.states.forEach(s=>{ const cnt={};
      a.transitions.filter(t=>t.from===s.id).forEach(t=>(t.rules||[]).filter(r=>!r.aiLow&&!r.scanIncomplete).forEach(r=>{ cnt[r.read]=(cnt[r.read]||0)+1; }));
      Object.keys(cnt).forEach(rd=>{ if(cnt[rd]>1) dupes.push({state:s,sym:rd}); });
    });
    return {starts,dupes,gaps:[],alpha:[],deterministic:dupes.length===0,complete:false};
  }
  if(a.type==='pda'){
    /* המקרה שבו כמה כללים עשויים להתאים נשאר פתוח במפרט. לכן איננו
       מכריזים עליו אוטומטית כ"שגיאה" או כ-NPDA, אך גם איננו בוחרים rules[0]
       בשקט. כללים חסומים/לא-מאושרים אינם משתתפים בבדיקה. */
    const ambiguities=[];
    a.states.forEach(s=>{
      const candidates=[];
      a.transitions.filter(t=>t.from===s.id).forEach(t=>(t.rules||[]).forEach(r=>{
        if(r.scanIncomplete||pdaRuleBlocked(r))return;
        candidates.push({t,r,P:pdaRuleParts(r)});
      }));
      for(let i=0;i<candidates.length;i++)for(let j=i+1;j<candidates.length;j++){
        const a1=candidates[i],a2=candidates[j];
        const readOverlap=a1.P.read===a2.P.read||!a1.P.read||!a2.P.read;
        const topOverlap=a1.P.guard===a2.P.guard||!a1.P.guard||!a2.P.guard;
        if(!readOverlap||!topOverlap)continue;
        const outcome=x=>[x.t.to,Boolean(x.P.read),x.P.op,x.P.push.join(''),x.P.popSym||''].join('\u0001');
        if(outcome(a1)===outcome(a2))continue; /* שתי ראיות לאותה תוצאה נשמרות אך אינן יוצרות בחירה */
        ambiguities.push({state:s,sym:`קלט ${a1.P.read||'ε'} מול ${a2.P.read||'ε'}, ראש ${a1.P.guard||'ε'} מול ${a2.P.guard||'ε'}`});
      }
    });
    return {starts,dupes:[],ambiguities,gaps:[],alpha:[],deterministic:ambiguities.length?null:true,complete:false};
  }
  const ALPHA=alphabet();
  a.states.forEach(s=>{
    const cnt={}, cov=new Set();
    a.transitions.filter(t=>t.from===s.id).forEach(t=>(t.symbols||[]).forEach(sym=>{ cnt[sym]=(cnt[sym]||0)+1; cov.add(sym); }));
    Object.keys(cnt).forEach(sym=>{ if(cnt[sym]>1) dupes.push({state:s,sym}); });
    const miss=ALPHA.filter(x=>!cov.has(x)); if(miss.length) gaps.push({state:s,miss});
  });
  const deterministic=dupes.length===0;
  const complete=gaps.length===0 && ALPHA.length>0 && a.states.length>0;
  return {starts,dupes,gaps,alpha:ALPHA,deterministic,complete};
}
function completeAutomaton(){
  const v=computeValidation();
  if(!v.deterministic){ toast('תקן את הדטרמיניזם תחילה','danger'); return; }
  if(v.starts.length!==1){ toast('צריך מצב התחלתי אחד','danger'); return; }
  if(v.complete){ toast('האוטומט כבר מלא'); return; }
  const ALPHA=alphabet(), xs=current.states.map(s=>s.x), ys=current.states.map(s=>s.y);
  const trap={id:uid(), label:trapLabel(), x:(Math.min(...xs)+Math.max(...xs))/2, y:Math.max(...ys)+170, isStart:false, isAccept:false};
  current.states.push(trap);
  current.transitions.push({id:uid(), from:trap.id, to:trap.id, symbols:[...ALPHA]});
  current.states.forEach(s=>{ if(s.id===trap.id)return;
    const cov=new Set(); current.transitions.filter(t=>t.from===s.id).forEach(t=>t.symbols.forEach(x=>cov.add(x)));
    const miss=ALPHA.filter(x=>!cov.has(x));
    if(miss.length) current.transitions.push({id:uid(), from:s.id, to:trap.id, symbols:miss});
  });
  save(); renderAll(); fitView(); toast('נוסף מצב בור — האוטומט עכשיו מלא','success');
}
function trapLabel(){ const used=new Set(current.states.map(s=>s.label)); if(!used.has('qבור'))return 'qבור'; let i=1; while(used.has('qבור'+i)) i++; return 'qבור'+i; }

/* ─── geometry ─── */
function geomEdge(c1,c2,bend){
  const dx=c2.x-c1.x, dy=c2.y-c1.y, len=Math.hypot(dx,dy)||1, ux=dx/len, uy=dy/len, px=-uy, py=ux;
  const mx=(c1.x+c2.x)/2+px*bend, my=(c1.y+c2.y)/2+py*bend;
  const a1=Math.atan2(my-c1.y,mx-c1.x), a2=Math.atan2(my-c2.y,mx-c2.x);
  const sx=c1.x+R*Math.cos(a1), sy=c1.y+R*Math.sin(a1), ex=c2.x+R*Math.cos(a2), ey=c2.y+R*Math.sin(a2);
  const qx=0.25*sx+0.5*mx+0.25*ex, qy=0.25*sy+0.5*my+0.25*ey;
  const off = bend===0 ? -22 : (bend>0 ? 16 : -16);
  return { d:`M ${sx.toFixed(1)} ${sy.toFixed(1)} Q ${mx.toFixed(1)} ${my.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`, lx:qx+px*off, ly:qy+py*off };
}
function geomLoop(c,index,total){
  index=index||0;total=total||1;
  const lift=62+index*28,spread=60+index*12,shift=(index-(total-1)/2)*10;
  return { d:`M ${c.x-20} ${c.y-R+8} C ${c.x-spread+shift} ${c.y-R-lift}, ${c.x+spread+shift} ${c.y-R-lift}, ${c.x+20} ${c.y-R+8}`, lx:c.x+shift, ly:c.y-R-lift-2 };
}
function isSelfLoopTransition(t){
  return Boolean(t && t.from!=null && t.from===t.to);
}
function edgeGeom(t){ const a=stById(t.from), b=stById(t.to);
  const parallels=current.transitions.filter(o=>o.from===t.from&&o.to===t.to&&isSelfLoopTransition(o)===isSelfLoopTransition(t));
  const index=Math.max(0,parallels.findIndex(o=>o.id===t.id));
  if(isSelfLoopTransition(t)) return geomLoop(a||b,index,parallels.length);
  const rev=current.transitions.some(o=>o.from===t.to&&o.to===t.from&&o.id!==t.id);
  const bend=(rev?54:20)+(index-(parallels.length-1)/2)*42;
  return geomEdge(a,b,bend); }   /* חצים מקבילים מקבלים עקמומיות שונה ואינם מסתירים זה את זה */

/* ─── render: graph ─── */
function applyView(){ $('canvas').setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`); }
/* הפאנלים הצפים מכסים חלקים מהקנבס. מחפשים את המלבן הפנוי הגדול: חותכים
   את הקנבס מול כל פאנל (מהגדול לקטן) ובוחרים בכל פעם את הצד הגדול שנשאר.
   אם נשאר פחות מ-40% בציר כלשהו (מסך צר) — חוזרים לקנבס המלא. */
function canvasFreeRect(wrap,cw,ch,minRatio=0.4){
  const full={x:0,y:0,w:cw,h:ch};
  try{
    const base=wrap.getBoundingClientRect();
    if(!base||!(base.width>0)||typeof getComputedStyle!=='function')return full;
    const occluders=['tabBar','controlPanel','aiReviewPanel','stackFloat','tapeFloat','guideFloat'].map(id=>document.getElementById(id))
      .filter(el=>el&&getComputedStyle(el).display!=='none')
      .map(el=>{const r=el.getBoundingClientRect();return {x:r.left-base.left,y:r.top-base.top,w:r.width,h:r.height};})
      .filter(o=>o.w>0&&o.h>0).sort((a,b)=>b.w*b.h-a.w*a.h);
    let free=full;
    for(const o of occluders){
      const ox2=o.x+o.w,oy2=o.y+o.h,fx2=free.x+free.w,fy2=free.y+free.h;
      if(ox2<=free.x||o.x>=fx2||oy2<=free.y||o.y>=fy2)continue;
      const sides=[{x:free.x,y:free.y,w:o.x-free.x,h:free.h},{x:ox2,y:free.y,w:fx2-ox2,h:free.h},
        {x:free.x,y:free.y,w:free.w,h:o.y-free.y},{x:free.x,y:oy2,w:free.w,h:fy2-oy2}].filter(r=>r.w>0&&r.h>0);
      if(!sides.length)return full;
      free=sides.reduce((a,b)=>b.w*b.h>a.w*a.h?b:a);
    }
    return free.w>=cw*minRatio&&free.h>=ch*minRatio?free:full;
  }catch(e){ return full; }
}
function fitView(){
  const wrap=$('canvasArea')||$('stage'); const cw=wrap.clientWidth||1000, ch=wrap.clientHeight||680;
  if(!current || !current.states.length){ view={x:0,y:0,w:cw,h:ch}; applyView(); return; }
  const xs=current.states.map(s=>s.x), ys=current.states.map(s=>s.y);
  const hasLoops=current.transitions.some(isSelfLoopTransition);
  const minx=Math.min(...xs)-120, maxx=Math.max(...xs)+120, miny=Math.min(...ys)-(hasLoops?170:120), maxy=Math.max(...ys)+110;
  /* s = יחידות עולם לפיקסל; הגרף ממורכז במלבן הפנוי ולא במרכז הקנבס */
  const free=canvasFreeRect(wrap,cw,ch), s=Math.max((maxx-minx)/free.w,(maxy-miny)/free.h);
  view={x:(minx+maxx)/2-(free.x+free.w/2)*s, y:(miny+maxy)/2-(free.y+free.h/2)*s, w:cw*s, h:ch*s}; applyView();
}
function zoom(f){ const w=Math.min(5000,Math.max(260, view.w*f)); const ratio=w/view.w;
  const cx=view.x+view.w/2, cy=view.y+view.h/2; view.w=w; view.h*=ratio; view.x=cx-view.w/2; view.y=cy-view.h/2; applyView(); }

   תווים חותכים עם … — השם המלא נשאר ב-title (ריחוף) ובשם שקורא מסך מקריא. */

function tmStep(s){

  const read = (s.head in s.tape) ? s.tape[s.head] : BLANK;
  let rule=null, trans=null;

/* כל הקונפיגורציות שכבר הוצגו בריצה. מסלול שחוזר לאחת מהן (למשל לולאת ε
   שאינה משנה את המחסנית) לא יגלה שום דבר חדש — כמו ב-npdaAccepts — ולכן
   אינו מוצג שוב. נגזר מההיסטוריה, כדי שחזרה אחורה תשאיר אותו עקבי. */
function npdaSeenKeys(s){
  if(!s.seen){ s.seen=new Set(); s.history.forEach(h=>h.forEach(c=>s.seen.add(pdaCfgKey(c)))); s.configs.forEach(c=>s.seen.add(pdaCfgKey(c))); }
  return s.seen;
}
function npdaStep(s){
  if(s.configs.some(c=>pdaCfgAccepts(c,s.input.length))){ s.status='accepted'; s.reason='קיים מסלול שמסיים במצב מקבל עם המחסנית בתחתית ✓'; return; }
  const next=[], seen=npdaSeenKeys(s);
  let revisits=0;
  for(const c of s.configs) for(const nc of pdaSuccCfg(c, s.input)){ const k=pdaCfgKey(nc); if(seen.has(k)){ revisits++; continue; } seen.add(k); next.push(nc); }
  s.history.push(s.configs); s.configs=next; s.step=(s.step||0)+1;
  if(!next.length){ s.status='rejected'; s.reason=revisits?'כל המסלולים נתקעו או חזרו לקונפיגורציות שכבר נבדקו (לולאה) ✗':'כל המסלולים נתקעו ✗'; }
  else if(next.some(c=>pdaCfgAccepts(c,s.input.length))){ s.status='accepted'; s.reason='קיים מסלול מקבל ✓'; }
  else if(s.step>4000 || next.length>1500){ s.status='stopped'; s.reason='נעצר — ריבוי מסלולים/צעדים'; }
}
function npdaAccepts(input){
  input=String(input); const start=current.states.find(s=>s.isStart); if(!start) return false;
  const seen=new Set(), queue=[{state:start.id, pos:0, stack:[PDA_BOTTOM]}]; let g=0, head=0;
  /* מצביע ראש במקום shift(): shift מעתיק את כל התור בכל צעד (O(n²)) */
  while(head<queue.length && g++<400000){ const c=queue[head++]; const key=pdaCfgKey(c);
    if(seen.has(key)) continue; seen.add(key);
    if(pdaCfgAccepts(c,input.length)) return true;
    for(const nc of pdaSuccCfg(c,input)) queue.push(nc);
  }
  return false;
}
function pdaStep(s){
  if(s.npda) return npdaStep(s);
  if(pdaCfgAccepts(s, s.input.length)){ s.status='accepted'; s.reason=`הגענו למצב מקבל, כל הקלט נקרא והמחסנית חזרה לתחתית (${PDA_BOTTOM}) ✓`; s.lastVia=null; return; }
  const apps=pdaApplicable(s.state, s.pos, s.stack, s.input);
  /* ייתכן שאף כלל אינו מתאים לשילוב הנוכחי של INPUT ו-STACK_TOP.
     זו תוצאה לגיטימית: החץ פשוט אינו שמיש בקונפיגורציה הזאת. */
  if(!apps.length){ s.status='rejected'; s.lastVia=null;
    s.reason = (s.pos<s.input.length)
      ? `נתקעה — אין מעבר מ-${stById(s.state).label} על '${s.input[s.pos]}' כשבראש המחסנית '${s.stack[0]||'∅'}' ✗`
      : (stById(s.state).isAccept ? `הקלט נגמר במצב מקבל, אך המחסנית לא חזרה לתחתית ${PDA_BOTTOM} (יש בה ${s.stack.join('')||'∅'}) ✗` : `הקלט נגמר במצב לא-מקבל ✗`);
    return; }
  if(pdaDistinctApplicableOutcomes(apps)>1){ s.status='stopped'; s.lastVia=null;
    s.reason='נעצר — כמה כללים שונים מתאימים לקונפיגורציה הזאת; לא נבחר כלל לפי סדר התצוגה'; return; }
  s.history.push({state:s.state, pos:s.pos, stack:s.stack.slice(), lastVia:s.lastVia});
  if(!pdaApply(s, apps[0].t, apps[0].r)){ s.history.pop(); s.status='rejected'; s.lastVia=null;
    s.reason=`נתקעה — הפעולה על המחסנית נחסמה (${PDA_BOTTOM} אינו ניתן לדחיפה או לשליפה) ✗`; return; }
  s.step=(s.step||0)+1; s.nd=apps.length>1;
  if(pdaCfgAccepts(s, s.input.length)){ s.status='accepted'; s.reason=`הגענו למצב מקבל, כל הקלט נקרא והמחסנית חזרה לתחתית (${PDA_BOTTOM}) ✓`; }
  else if(!apps[0].P.read&&pdaStepEpsilonLoop(s)){ s.status='rejected'; s.lastVia=null; s.reason=PDA_EPS_LOOP_REASON; }
  else if(s.step>5000){ s.status='stopped'; s.reason='נעצר — ריצה ארוכה מדי (ייתכן לולאת ε)'; }
}
/* לולאת ε אינסופית בריצה דטרמיניסטית. במהלך רצף מעברי ε סימן הקלט הנוכחי
   קבוע, ולכן ההמשך תלוי רק במצב ובראש המחסנית: פריט שנדחף ונשאר מתחת לראש
   לעולם אינו נקרא. אם המחסנית עלתה יותר מ-|Q|·|Γ| רמות מעל הנקודה הנמוכה
   ביותר ברצף, זוג (מצב, ראש) חוזר בשני גבהים — והמכונה תחזור על אותו קטע
   ותגדל לנצח בלי לקרוא קלט. חזרה לקונפיגורציה זהה היא לולאה מאותה סיבה.
   ריצה כזאת לעולם אינה מסתיימת, ולכן המילה אינה מתקבלת. */
function pdaEpsilonLoopLimit(){
  const syms=new Set([PDA_BOTTOM]);
  current.transitions.forEach(t=>(t.rules||[]).forEach(r=>{ const P=pdaRuleParts(r);
    if(P.guard)syms.add(P.guard); P.push.forEach(x=>syms.add(x)); if(P.popSym)syms.add(P.popSym); }));
  return Math.max(1,current.states.length)*syms.size;
}
const PDA_EPS_LOOP_REASON='נעצרה — לולאת ε אינסופית: המכונה חוזרת על מעברי ε בלי לקרוא קלט ולעולם לא תסיים, ולכן המילה אינה מתקבלת ✗';
function pdaAccepts(input){
  if(current.ndet) return npdaAccepts(input);
  input=String(input); const start=current.states.find(s=>s.isStart); if(!start) return false;
  const limit=pdaEpsilonLoopLimit();
  let state=start.id, pos=0, stack=pdaInitialStack(), seen=new Set(), streakMin=stack.length, g=0;
  while(g++<200000){
    if(pos===input.length && stById(state).isAccept && pdaStackDone(stack)) return true;
    /* seen מתאפס בכל קריאת קלט: pos עולה בלבד, ולכן חזרה אפשרית רק בתוך רצף ε */
    const key=state+'|'+stack.join('\u0001'); if(seen.has(key)) return false;
    seen.add(key);
    const apps=pdaApplicable(state, pos, stack, input);
    if(!apps.length) return false;
    if(pdaDistinctApplicableOutcomes(apps)>1) return false;
    const P=apps[0].P;
    const next=pdaApplyToStack(P, stack);
    if(next===null) return false;
    stack=next;
    if(P.read){ pos++; seen=new Set(); streakMin=stack.length; }
    else{ streakMin=Math.min(streakMin,stack.length); if(stack.length-streakMin>limit) return false; }
    state=apps[0].t.to;
  }
  return false;
}
/* אותו מבחן לולאה עבור הריצה צעד-אחר-צעד. מחושב מתוך ההיסטוריה (כל
   הקונפיגורציות באותו pos הן רצף ה-ε הנוכחי), כך שחזרה אחורה וקדימה
   אינה משאירה מצב מיושן. */
function pdaStepEpsilonLoop(s){
  const run=s.history.filter(h=>h.pos===s.pos), key=s.stack.join('\u0001');
  if(run.some(h=>h.state===s.state&&h.stack.join('\u0001')===key))return true;
  const min=Math.min(s.stack.length,...run.map(h=>h.stack.length));
  return s.stack.length-min>pdaEpsilonLoopLimit();
}
function simBack(){ if(!SIM||!SIM.history.length)return; const h=SIM.history.pop();
  if(SIM.tm){ SIM.stateId=h.stateId; SIM.head=h.head; SIM.tape[h.head]=h.prev; SIM.lastTransId=h.lastTransId; if(SIM.trail)SIM.trail.pop(); SIM.steps=Math.max(0,(SIM.steps||1)-1); SIM.status='running'; SIM.reason=''; return; }
  if(SIM.npda){ SIM.configs=h; SIM.seen=null; SIM.step=Math.max(0,(SIM.step||1)-1); SIM.status='running'; SIM.reason=''; return; }
  if(SIM.pda){ SIM.state=h.state; SIM.pos=h.pos; SIM.stack=h.stack; SIM.lastVia=h.lastVia; SIM.step=Math.max(0,(SIM.step||1)-1); SIM.status='running'; SIM.reason=''; return; }
  if(SIM.nfa){ SIM.states=h; SIM.pos=Math.max(0,SIM.pos-1); SIM.via=[]; SIM.status='running'; SIM.reason=''; return; }
  SIM.stateId=h.stateId; SIM.pos=h.pos; SIM.lastTransId=h.lastTransId; if(SIM.trail)SIM.trail.pop(); SIM.status='running'; SIM.reason=''; }

function animateEdgePulse(transId){
  const line=$('canvas').querySelector(`[data-trans-id="${transId}"] .eline`); if(!line) return;
  const len=line.getTotalLength(); if(!len) return;
  const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
  dot.setAttribute('class','pulse-dot'); dot.setAttribute('r','7');
  $('nodes').appendChild(dot);
  const dur=Math.max(180, Math.min(speed*0.75, 600)); let t0=null;
  function frame(t){ if(t0===null)t0=t; const k=Math.min(1,(t-t0)/dur), pt=line.getPointAtLength(len*k);
    dot.setAttribute('cx',pt.x); dot.setAttribute('cy',pt.y);
    if(k<1) requestAnimationFrame(frame); else dot.remove(); }
  requestAnimationFrame(frame);
}
function pulseState(stateId){
  const g=$('canvas').querySelector(`[data-state-id="${stateId}"]`); if(!g) return;
  const ring=document.createElementNS('http://www.w3.org/2000/svg','circle');
  ring.setAttribute('class','state-ripple'); ring.setAttribute('r',R); ring.setAttribute('cx','0'); ring.setAttribute('cy','0');
  g.appendChild(ring); setTimeout(()=>{ ring.remove(); }, 560);
}
function doStep(){ if(!SIM) return;
  if(SIM.npda){ const before=SIM.step||0; simStepObj(SIM); renderSim();
    if((SIM.step||0)>before){ [...new Set(SIM.configs.map(c=>c.via).filter(Boolean))].forEach(animateEdgePulse); [...new Set(SIM.configs.map(c=>c.state))].forEach(pulseState); }
    return; }
  if(SIM.pda){ const before=SIM.step||0; simStepObj(SIM); renderSim();
    if((SIM.step||0)>before){ if(SIM.lastVia)animateEdgePulse(SIM.lastVia); pulseState(SIM.state); }
    return; }
  if(SIM.nfa){ const before=SIM.pos; simStepObj(SIM); renderSim();
    if(SIM.pos>before){ (SIM.via||[]).forEach(animateEdgePulse); SIM.states.forEach(pulseState); }
    return; }
  const before=(SIM.trail||[]).length; simStepObj(SIM); renderSim();
  if((SIM.trail||[]).length>before && SIM.lastTransId){ animateEdgePulse(SIM.lastTransId); pulseState(SIM.stateId); } }
function simFwdR(){ doStep(); }
function simBackR(){ simBack(); renderSim(); }
function startPlay(){ if(playTimer)return; playTimer=setInterval(()=>{ if(!SIM||SIM.status!=='running'){ stopPlay(); renderSim(); return; } doStep(); }, speed); renderSim(); }
function togglePlay(){ if(playTimer){ stopPlay(); renderSim(); } else startPlay(); }

function stopPlay(){ if(playTimer){ clearInterval(playTimer); playTimer=null; } }

function paintSim(){
  qa('.node.active').forEach(n=>n.classList.remove('active','ok','bad'));
  qa('.edge').forEach(e=>{ e.classList.remove('cur'); const l=e.querySelector('.eline'); if(l) l.setAttribute('marker-end',e.classList.contains('ai-low')?'url(#arrowA)':'url(#arrow)'); });
  if(!SIM)return;
  if(SIM.nfa){
    const accSet=new Set(SIM.states.filter(id=>stById(id).isAccept));
    SIM.states.forEach(id=>{ const n=$('canvas').querySelector(`[data-state-id="${id}"]`); if(n){ n.classList.add('active'); if(SIM.status==='accepted' && accSet.has(id)) n.classList.add('ok'); } });
    (SIM.via||[]).forEach(tid=>{ const e=$('canvas').querySelector(`[data-trans-id="${tid}"]`); if(e){ e.classList.add('cur'); const l=e.querySelector('.eline'); if(l) l.setAttribute('marker-end','url(#arrowG)'); } });
    return;
  }
  if(SIM.npda){
    const accSt=new Set(SIM.configs.filter(c=>pdaCfgAccepts(c,SIM.input.length)).map(c=>c.state));
    [...new Set(SIM.configs.map(c=>c.state))].forEach(sid=>{ const n=$('canvas').querySelector(`[data-state-id="${sid}"]`); if(n){ n.classList.add('active'); if(accSt.has(sid))n.classList.add('ok'); } });
    [...new Set(SIM.configs.map(c=>c.via).filter(Boolean))].forEach(tid=>{ const e=$('canvas').querySelector(`[data-trans-id="${tid}"]`); if(e){ e.classList.add('cur'); const l=e.querySelector('.eline'); if(l) l.setAttribute('marker-end','url(#arrowG)'); } });
    return;
  }
  if(SIM.pda){
    const n=$('canvas').querySelector(`[data-state-id="${SIM.state}"]`);
    if(n){ n.classList.add('active'); if(SIM.status==='accepted')n.classList.add('ok'); if(SIM.status==='rejected')n.classList.add('bad'); }
    if(SIM.lastVia){ const e=$('canvas').querySelector(`[data-trans-id="${SIM.lastVia}"]`); if(e){ e.classList.add('cur'); const l=e.querySelector('.eline'); if(l) l.setAttribute('marker-end','url(#arrowG)'); } }
    return;
  }
  if(SIM.lastTransId){ const e=$('canvas').querySelector(`[data-trans-id="${SIM.lastTransId}"]`); if(e){ e.classList.add('cur'); const l=e.querySelector('.eline'); if(l) l.setAttribute('marker-end','url(#arrowG)'); } }  /* רק המעבר הנוכחי בירוק — לא נשאר */
  const node=$('canvas').querySelector(`[data-state-id="${SIM.stateId}"]`);
  if(node){ node.classList.add('active'); if(SIM.status==='accepted')node.classList.add('ok'); if(SIM.status==='rejected')node.classList.add('bad'); }
}
function tapeHTML(chars, pos, status){
  const cells = chars.length ? chars.map((c,i)=>{
    let cls='cell'; const head=i===pos&&(status==='running'||status==='preview'); const stuck=status==='rejected'&&i===pos;
    if(status!=='preview'&&i<pos)cls+=' read'; if(head)cls+=' head'; if(stuck)cls+=' stuck';
    return `<span class="${cls}">${esc(c)}${head?'<span class="hmark"></span>':''}</span>`;
  }).join('') : '<span class="cell empty">ε — מילה ריקה</span>';
  return `<div class="tape-cells">${cells}</div>`;
}
function tmTapeHTML(s){
  const used=Object.keys(s.tape).map(Number);
  const lo=Math.min(s.head, used.length?Math.min(...used):s.head);
  const hi=Math.max(s.head, used.length?Math.max(...used):s.head);
  let cells='';
  for(let p=lo;p<=hi;p++){ const v=(p in s.tape)?s.tape[p]:BLANK; const head=p===s.head;
    cells+=`<span class="cell ${head?'head':''} ${v===BLANK?'blank':''} ${v==='&'?'marker':''}">${esc(v)}${head?'<span class="hmark"></span>':''}</span>`; }
  return `<div class="tape-cells">${cells}</div>`;
}
function tmPreviewHTML(word){ const chars=[...String(word)];
  const cell=(v,head)=>`<span class="cell ${head?'head':''} ${v===BLANK?'blank':''} ${v==='&'?'marker':''}">${esc(v)}${head?'<span class="hmark"></span>':''}</span>`;
  let html = cell('&')+cell('&');                  /* שני סימני התחלה */
  chars.forEach((c,i)=> html+=cell(c, i===0));     /* קלט, ראש על הראשון */

  }
  const top = s.stack.length? esc(s.stack[0]) : 'ריק';

  return `${ctrls}
    <div class="simstat" style="margin-top:9px">
      <div>מצב פעיל: <b>${esc(stById(s.state).label)}</b></div>

    </div>

    ${s.reason?`<div class="simline" style="margin-top:6px">${esc(s.reason)}</div>`:''}
    ${verdict?`<div style="margin-top:8px">${verdict}</div>`:''}`;
}
function pdaStackHTML(c){
  const chars=[...c.stack];
  if(!chars.length) return `<div class="stk-wrap"><div class="stk"><div class="stk-cell empty">ריקה</div></div><div class="stk-floor"></div></div>`;
  const MAX=14; let shown=chars, extra=0;
  if(chars.length>MAX){ shown=chars.slice(0,MAX-1); extra=chars.length-(MAX-1); }
  let cells = shown.map((ch,i)=>`<div class="stk-cell${i===0?' top':''}">${esc(ch)}</div>`).join('');
  if(extra) cells += `<div class="stk-cell more">+${extra}</div>`;
  return `<div class="stk-wrap"><div class="stk-cap">ראש ↑</div><div class="stk">${cells}</div><div class="stk-floor"></div></div>`;
}
function pdaCfgCardHTML(c,len,input){

function openBatch(){ if(!current)return; const wrap=document.createElement('div'); wrap.innerHTML='<div id="batchBody"></div>';
  _buildDialog({title:'בדיקה עצמית — הרצת מילים', body:wrap, buttons:[{text:'סגור', value:null, primary:true}], dismissValue:null}); renderBatch(); }
function renderBatch(){
  const el=$('batchBody'); if(!el||!current) return;
  const rows=current.tests.map((t,i)=>`
    <div class="brow">
      <input class="fld bword" value="${esc(t.word)}" placeholder="מילה (ריק = ε)" aria-label="מילת מבחן ${i+1}" onchange="setTest(${i},'word',this.value)">

      <button class="btn btn-sm" onclick="delTest(${i})" title="מחק את המילה" aria-label="מחק את מילת מבחן ${i+1}">✕</button>

      <span class="bsum" id="batchSummary" role="status"></span>
    </div>${rows||'<div class="help-box">הוסף מילות מבחן עם התוצאה הצפויה, ובדוק שהאוטומט מזהה בדיוק את השפה.</div>'}`;
}
function setTest(i,k,v){ if(k==='expect') v=(v==='true'); current.tests[i][k]=v; save(); }
function addTest(){ current.tests.push({word:'',expect:true}); save(); renderBatch(); }
function delTest(i){ current.tests.splice(i,1); save(); renderBatch(); }
function runBatch(){ if(!simReady())return; let pass=0;
  current.tests.forEach((t,i)=>{ const span=$('bres-'+i); if(!span)return;
    const res=runQuick(t.word), acc=res.status==='accepted', ok=(acc===!!t.expect); if(ok)pass++;
    span.textContent=(ok?'✓ ':'✗ ')+(acc?'מתקבלת':'נדחית'); span.className='bres '+(ok?'ok':'bad'); });
  const sum=$('batchSummary'); if(sum) sum.textContent=`${pass}/${current.tests.length} עברו`;
}

}
