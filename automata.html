/* מזעור לוח הבקרה לשורת הכותרת בלבד — בעיקר בטלפון, שם הלוח תופס יותר
   מחצי המסך. ההעדפה נשמרת רק בדפדפן של הצופה. */
function setControlPanelCollapsed(collapsed){
  const p=$('controlPanel'),b=$('cpToggle'); if(!p)return;
  p.classList.toggle('collapsed',collapsed);
  if(b){ b.textContent=collapsed?'▾':'▴'; b.title=collapsed?'הרחב את לוח הבקרה':'מזער את לוח הבקרה'; b.setAttribute('aria-expanded',String(!collapsed)); }
}
function toggleControlPanel(){
  const collapsed=!$('controlPanel').classList.contains('collapsed');
  setControlPanelCollapsed(collapsed);
  try{ localStorage.setItem('automata_cp_collapsed',collapsed?'1':''); }catch(e){}
  fitView();
}
function makeDraggable(el, handle){
  let sx=0, sy=0, ox=0, oy=0, dragging=false;
  handle.addEventListener('pointerdown', e=>{
    if(e.target.closest('button,input,a,select')) return;
    dragging=true; const r=el.getBoundingClientRect();
    el.style.left=r.left+'px'; el.style.top=r.top+'px'; el.style.right='auto'; el.style.bottom='auto'; el.style.transform='none';
    sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
    try{ handle.setPointerCapture(e.pointerId); }catch(_){}
  });
  handle.addEventListener('pointermove', e=>{ if(!dragging) return;
    let nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    nx=Math.max(4, Math.min(innerWidth-el.offsetWidth-4, nx));
    ny=Math.max(4, Math.min(innerHeight-el.offsetHeight-4, ny));
    el.style.left=nx+'px'; el.style.top=ny+'px';
  });
  handle.addEventListener('pointerup', ()=>{ dragging=false; });
}
function toggleGuide(){ const b=$('guideBody'), c=$('guideChev'), btn=$('guideBtn'); const open=b.style.display!=='none';
  b.style.display=open?'none':'block'; if(c)c.textContent=open?'▴':'▾'; if(btn)btn.setAttribute('aria-expanded',String(!open)); }
/* שורה משותפת לכל גרסאות המדריך */
const GUIDE_UNDO_TIP='<li>מחקת בטעות? לחץ <b>«בטל»</b> בהודעה שמופיעה, או <b>Ctrl+Z</b>.</li>';
function renderGuide(){ const el=$('guideBody'); if(!el) return;
  if(current && current.type==='pda'){ el.innerHTML=`<ul>
      <li><b>אוטומט מחסנית ${current.ndet?'לא-דטרמיניסטי':'דטרמיניסטי'}:</b> מצבים + <b>מחסנית</b> שמתחילה עם <b>⊥</b> בתחתית.</li>
      ${current.ndet
        ? '<li><b>לא-דטרמיניסטי:</b> כשכמה מעברים אפשריים — <b>כל המסלולים נבדקים במקביל</b> (לכל מסלול מחסנית משלו). המילה <b>מתקבלת אם קיים מסלול מקבל</b> אחד.</li>'
        : '<li><b>דטרמיניסטי:</b> בכל צעד מתאים מעבר <b>יחיד</b> (מסלול אחד, מחסנית אחת). אם יותר מכלל אחד עשוי להתאים — ההרצה נחסמת עם הסבר, ואפשר לתקן את הכללים או לבחור אוטומט לא-דטרמיניסטי.</li>'}
      <li><b>כלל מעבר:</b> <b>קלט · מה בראש המחסנית · פעולה</b> (דחיפה / שליפה / ללא).</li>
      <li><b>«מה בראש המחסנית»</b> = תנאי: מה חייב להיות בראש כדי שהמעבר יתבצע (ε = לא משנה). הוא <b>לא נשלף</b> אלא אם בחרת «שליפה».</li>
      <li><b>דחיפה</b> מוסיפה פריט חדש <b>מעל</b> הראש הקיים — הראש הישן נשאר ויורד שכבה אחת. הסימן שנדחף <b>רשאי להיות שונה</b> מראש המחסנית, אך לעולם אינו יכול להיות <b>⊥</b>.</li>
      <li><b>שליפה</b> מסירה רק את הפריט העליון, והסימן הנשלף <b>חייב להיות זהה</b> לראש המחסנית.</li>
      <li>למשל <b>a,S/+A</b> = קרא a, אם בראש S, דחוף A (וה-S נשאר מתחת). <b>b,A/−A</b> = קרא b, אם בראש A, שלוף אותו.</li>
      <li><b>⊥</b> הוא סימן התחתית והוא <b>מוגן</b> — אין לשלוף אותו ואין לדחוף מופע נוסף שלו. הוא קיים פעם אחת בלבד בתחתית, ולכן המחסנית לעולם אינה מתרוקנת.</li>
      <li>על חץ אחד יכולים לשבת <b>כמה כללים עצמאיים</b>. בכל צעד נבחר רק הכלל שמתאים גם לקלט וגם לראש המחסנית; ייתכן שאף כלל אינו מתאים.</li>
      <li><b>לחיצה כפולה</b> על מצב = כלל-עצמי.</li>
      <li><b>קבלה:</b> כל הקלט נקרא, נמצאים ב<b>מצב מקבל</b>, והמחסנית חזרה ל<b>תחתית (⊥)</b>.</li>
      ${GUIDE_UNDO_TIP}
    </ul>`; return; }
  if(current && current.type==='dfa' && current.ndet){ el.innerHTML=`<ul>
      <li><b>אוטומט סופי לא-דטרמיניסטי (NFA):</b> מאותו מצב מותר <b>כמה מעברים על אותו סימן</b>, וגם מעברי-<b>ε</b> (מעבר בלי לקרוא אות).</li>
      <li>בריצה נשמרת <b>קבוצת מצבים פעילים</b> — כל המסלולים נבדקים במקביל (תראה אותם מודגשים יחד).</li>
      <li><b>בניית מעבר:</b> לחץ מצב מקור ואז יעד, והקלד סימן. למעבר <b>ε</b> (בלי לקרוא אות) — לחץ על <b>הכפתור ε</b> שבחלון, או בעורך המעבר שבלוח הבקרה.</li>
      <li><b>לחיצה כפולה</b> על מצב = לולאה עצמית.</li>
      <li><b>קבלה:</b> המילה מתקבלת אם <b>קיים ולו מסלול אחד</b> שמסיים ב<b>מצב מקבל</b>.</li>
      ${GUIDE_UNDO_TIP}
    </ul>`; return; }
  el.innerHTML = (current && current.type==='tm') ? `<ul>
      <li><b>מכונת טיורינג:</b> סרט עם ראש קורא/כותב שזז ימינה/שמאלה.</li>
      <li>גבולות הסרט: <b>&amp;&amp;</b> בהתחלה ו-<b>&amp;</b> בסוף — קבועים, אי אפשר לכתוב עליהם (אפשר רק לקרוא).</li>
      <li>תו ריק = <b>_</b>.</li>
      <li><b>בניית כלל:</b> לחץ מצב מקור ואז יעד, והגדר <b>קורא / כותב / תנועה</b>.</li>
      <li>תווית כלל: <b>קורא→כותב,כיוון</b> (למשל 0→1,R).</li>
      <li><b>לחיצה כפולה</b> על מצב = כלל-עצמי (לולאה).</li>
      <li>בכל מצב — <b>כלל אחד לכל תו נקרא</b> (המכונה דטרמיניסטית).</li>
      <li><b>קבלה:</b> עוצרת ומקבלת כשמגיעה למצב מקבל; אין כלל מתאים ⟵ נדחית; ריצה שלא נגמרת נעצרת אחרי 20000 צעדים.</li>
      <li>«הסרט שלך» = התוכן ההתחלתי של הסרט.</li>
      ${GUIDE_UNDO_TIP}
    </ul>` : `<ul>
      <li>עיגול = מצב · עיגול כפול = מצב <b>מקבל</b>.</li>
      <li>חץ נכנס מבחוץ = המצב <b>ההתחלתי</b> (המצב הראשון שתיצור; אפשר לשנות בלוח הבקרה).</li>
      <li>תווית "a, b" = מעבר על <b>a</b> וגם על <b>b</b>.</li>
      <li><b>בניית מעבר:</b> לחץ על מצב מקור ואז על מצב יעד, והקלד סימן.</li>
      <li><b>לחיצה כפולה</b> על מצב = לולאה עצמית.</li>
      <li><b>דטרמיניסטי:</b> מכל מצב — לכל היותר מעבר אחד על כל סימן. אם אין מעבר על הסימן הנוכחי, המילה נדחית (אוטומט לא מלא).</li>
      <li>מעברי <b>ε</b> (בלי לקרוא אות) קיימים רק ב<b>אוטומט סופי לא-דטרמיניסטי</b> — בוחרים אותו ב-+ (מודל חדש).</li>
      <li><b>קבלה:</b> המילה מתקבלת אם הריצה מסתיימת במצב מקבל.</li>
      ${GUIDE_UNDO_TIP}
    </ul>`;
}
function renderModeBits(){ const wi=$('simWord');
  const wl=$('wordLabel'); if(wl) wl.textContent = (current&&current.type==='pda') ? 'מילת הקלט' : (current&&current.type==='tm') ? 'הסרט שלך' : 'המילה שלך';
  if(wi&&wl) wi.setAttribute('aria-label',wl.textContent);

  el.innerHTML = DB.automata.map(a=>`
    <div class="tab ${current&&a.id===current.id?'active':''}" data-tab="${a.id}" title="${esc(a.name)}">

function exportCurrent(){ if(!current){ toast('אין מודל פתוח לשמירה','danger'); return; } const file=safeName(current.name)+'.json'; download(file, JSON.stringify(current,null,2)); toast(`המודל נשמר לקובץ «${file}»`,'success'); }
function init(){
  load(); setIcons();
  if(!DB.automata.length) seedExamples();
  if(LOAD_BACKUP_KEY) setTimeout(()=>toast(`הנתונים השמורים לא נקראו. עותק שלהם נשמר בדפדפן תחת «${LOAD_BACKUP_KEY}» ולא נמחק.`,'danger',15000),0);
  else if(LOAD_REPAIRED) setTimeout(()=>toast(`תוקנו נתונים שמורים: ${droppedTransitionsText(LOAD_REPAIRED)}`,'danger',15000),0);
  qa('.float-head').forEach(h=>{ const card=h.closest('.float'); if(card) makeDraggable(card, h); });
  try{ if(localStorage.getItem('automata_cp_collapsed')==='1') setControlPanelCollapsed(true); }catch(e){}
  $('tabs').addEventListener('click', e=>{ const x=e.target.closest('[data-close]'), tab=e.target.closest('[data-tab]');
    if(x){ e.stopPropagation(); closeTab(x.dataset.close); } else if(tab){ openAutomaton(tab.dataset.tab); } });
  $('canvas').addEventListener('pointerdown', onDown);
  $('canvas').addEventListener('wheel', e=>{ e.preventDefault(); zoom(e.deltaY>0?1.1:0.9); }, {passive:false});
  document.addEventListener('keydown', e=>{
    if(e.target.matches('input,textarea,select')) return;
    if(topModal()) return;   /* חלון פתוח: Backspace/Escape לא מוחקים או מבטלים בחירה מאחוריו */
    if(handleUndoShortcut(e)) return;
    const g=(e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('[data-state-id],[data-trans-id]');
    if(g){ e.preventDefault(); if(g.dataset.stateId)onStateClick(g.dataset.stateId); else { armed=null; selectTransition(g.dataset.transId); } return; }
    if(e.key==='Delete'||e.key==='Backspace'){ if(sel.type==='state') deleteState(sel.id); else if(sel.type==='transition') deleteTransition(sel.id); }
    else if(e.key==='Escape'){ armed=null; deselect(); }
    else if(e.key==='n'||e.key==='N'){ addStateCentered(); }
  });
  window.addEventListener('resize', ()=>{ if(!SIM) applyView(); });
  applyView();
  openAutomaton(DB.settings.lastId || (DB.automata[0]&&DB.automata[0].id));
}
init();
